name: Validação do Projeto

on:
  push:
    branches:
      - main
      - feature/contatos
      - feature/favoritos

jobs:
  validacao:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Verificar arquivos do projeto
        run: |
          test -f README.md
          echo "README.md encontrado"

      - name: Exibir mensagem
        run: echo "Agenda de Contatos validada com sucesso!"